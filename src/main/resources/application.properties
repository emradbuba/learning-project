app.version=@project.version@

##################
# Service        #
##################
server.port=8080

##################
# Eventing       #
##################
eventing.amq.broker.name=ActiveMQ Broker
eventing.amq.broker.url=tcp://localhost:61616
eventing.amq.broker.username=artemis
eventing.amq.broker.password=artemis

# Producers

eventing.amq.producer.peer.name=PeerToPeerProducer
eventing.amq.producer.pubsub.name=PubSubProducer
eventing.amq.producer.peer.destination.name=PeerToPeerQueue
eventing.amq.producer.pubsub.destination.name=PubSubTopic

# Consumers
eventing.amq.consumer.peer.first.name=PeerToPeerConsumerA
eventing.amq.consumer.peer.second.name=PeerToPeerConsumerB
eventing.amq.consumer.peer.first.source.name=PeerToPeerQueue
eventing.amq.consumer.peer.second.source.name=PeerToPeerQueue

eventing.amq.consumer.pubsub.first.name=PubSubConsumerA
eventing.amq.consumer.pubsub.second.name=PubSubConsumerB
eventing.amq.consumer.pubsub.first.source.name=PubSubTopic
eventing.amq.consumer.pubsub.second.source.name=PubSubTopic


##################
# H2 database    #
##################
spring.datasource.url=jdbc:h2:mem:test2db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=pass
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
#logging.level.org.hibernate.SQL=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

##################
# Actuator       #
##################

# Basic settings
# ---------------

# Redundant, cause by default all endpoints are enabled, nevertheless:
management.endpoints.enabled-by-default=true

# By default, all endpoints (apart from 'health' are not exposed)
management.endpoints.web.exposure.include=health,info

# Do not expose health via JMX (by default it would be exposed)
management.endpoints.jmx.exposure.exclude=health,info


# Info settings (enabling default InfoIndicators):
# ---------------

management.endpoints.web.path-mapping.info=/appinfo
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.env.enabled=true
info.app.description=Sample static info
info.build.version=@project.version@
info.custom.static.information=This is the custom info from actuator

# Health liveness and readiness
# ---------------

management.endpoint.health.probes.enabled=true


##################
# Swagger        #
##################
springdoc.api-docs.path=/api-doc
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.filter=true


