app.version=${LEARNING_APP_NAME}

##################
# Service        #
##################
server.port=${SERVER_PORT}

##################
# Eventing       #
##################
# These values should be defined container...
eventing.amq.broker.name=${AMQ_BROKER_NAME}
eventing.amq.broker.url=${EVENTING_AMQ_BROKER_URL}
eventing.amq.broker.username=${EVENTING_AMQ_BROKER_USERNAME}
eventing.amq.broker.password=${EVENTING_AMQ_BROKER_PASSWORD}
eventing.amq.peer.source.name=${EVENTING_AMQ_PEER_SOURCE_NAME}
eventing.amq.pubsub.source.name=${EVENTING_AMQ_PUBSUB_SOURCE_NAME}

### Scheduler
eventing.scheduled.producer.enabled=true
eventing.scheduled.producer.interval.ms=10000
### Redelivery
# No configuration here:
# Redelivery configuration on Artemis is done on the broker in broker.xml <address-settings> !

##################
# H2 database    #
##################
spring.datasource.url=jdbc:h2:mem:test2db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=pass
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
#logging.level.org.hibernate.SQL=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

##################
# Actuator       #
##################

# Basic settings
# ---------------

# Redundant, cause by default all endpoints are enabled, nevertheless:
management.endpoints.enabled-by-default=true

# By default, all endpoints (apart from 'health' are not exposed)
management.endpoints.web.exposure.include=health,info

# Do not expose health via JMX (by default it would be exposed)
management.endpoints.jmx.exposure.exclude=health,info


# Info settings (enabling default InfoIndicators):
# ---------------

management.endpoints.web.path-mapping.info=/appinfo
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.env.enabled=true
info.app.description=Sample static info
info.build.version=@project.version@
info.custom.static.information=This is the custom info from actuator

# Health liveness and readiness
# ---------------

management.endpoint.health.probes.enabled=true


##################
# Swagger        #
##################
springdoc.api-docs.path=/api-doc
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.filter=true


